version: "3.9"

services:
  mlops-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    # El working dir es la raíz del repo dentro del contenedor
    working_dir: /app
    environment:
      # MLflow debe ser un endpoint accesible públicamente desde el runner
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MLFLOW_EXPERIMENT: ${MLFLOW_EXPERIMENT:-student-performance}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      # Monta el workspace del runner (Linux) en /app
      - ${GITHUB_WORKSPACE}:/app
      # Cache de DVC (acelera pulls/pushes entre steps del mismo job)
      - ${GITHUB_WORKSPACE}/.dvc/cache:/app/.dvc/cache
      # AWS credentials cache
      - ${GITHUB_WORKSPACE}/.aws:/root/.aws:ro
    command: >
      bash -lc "
        git config --global --add safe.directory /app &&
        echo '⬇️  dvc pull...' &&
        dvc pull --force &&
        echo '🚀 dvc repro...' &&
        dvc repro --force &&
        echo '⬆️  dvc push...' &&
        dvc push &&
        echo '✅ Pipeline completado.'
      "
